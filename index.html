<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网格路径覆盖</title>
<script src="coi-serviceworker.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #101418;
    --border: #2c3540;
    --text: #d5dde5;
    --muted: #8b98a5;
    --gold: #f0b429;
    --green: #2fb344;
    --red: #e5484d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 32px 20px 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  h1 {
    margin: 0 0 6px;
    font-size: 22px;
    letter-spacing: 1px;
  }
  .card {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .controls { display: flex; flex-direction: column; gap: 10px; }
  .ctl-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
  .controls label { display: flex; align-items: center; gap: 5px; color: var(--muted); }
  .controls .sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
  input[type="number"] {
    width: 60px; padding: 5px 8px; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 7px; color: var(--text);
    font: inherit;
  }
  input[type="checkbox"] { accent-color: var(--gold); }
  button {
    font: inherit;
    padding: 7px 15px;
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: border-color .15s, color .15s, background .15s, opacity .15s;
  }
  button:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary {
    background: var(--gold);
    border-color: var(--gold);
    color: #1a1500;
    font-weight: 600;
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.1); color: #1a1500; }
  button.sm { padding: 4px 10px; font-size: 12px; border-radius: 7px; }
  button.danger:hover:not(:disabled) { border-color: var(--red); color: var(--red); }
  .board-wrap { text-align: center; }
  canvas { display: inline-block; cursor: pointer; }
  .status {
    font-family: Consolas, "Courier New", monospace;
    font-size: 13px;
    text-align: center;
    color: var(--muted);
  }
  .status.sat { border-color: var(--green); color: var(--green); }
  .status.unsat { border-color: var(--red); color: var(--red); }
  .prog {
    font-family: Consolas, "Courier New", monospace;
    font-size: 12.5px;
    color: var(--gold);
    border-style: dashed;
  }
  .prog .timer { color: var(--muted); margin-left: 10px; }
  .hist-head {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin-bottom: 10px; font-size: 13px; color: var(--muted); font-weight: 600;
  }
  .hist-head .actions { display: flex; gap: 8px; margin-left: auto; }
  .clist { display: flex; flex-direction: column; gap: 6px; }
  .clist-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 8px 12px; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 9px; cursor: pointer;
    font-family: Consolas, "Courier New", monospace; font-size: 12.5px;
    text-align: left;
  }
  .clist-item:hover:not(.selected) { border-color: var(--muted); }
  .clist-item.selected { border-color: var(--gold); background: #26220f; }
  .clist-item .id { color: var(--muted); flex-shrink: 0; }
  .clist-item .label { flex-shrink: 0; }
  .clist-item .badge {
    padding: 1px 8px; border-radius: 10px; font-size: 11px; flex-shrink: 0;
    background: var(--green); color: #04150a; font-weight: 600;
  }
  .clist-item .counts { font-weight: 600; color: var(--gold); flex-shrink: 0; min-width: 15ch; }
  .clist-item .counts .num { display: inline-block; min-width: 3ch; text-align: right; }
  .clist-item .meta { color: var(--muted); flex: 1; text-align: right; }
  .clist-empty { color: var(--muted); font-size: 12.5px; padding: 4px 2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }
  .legend-item {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 10px; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 20px; cursor: pointer;
    font-size: 12px; font-family: Consolas, "Courier New", monospace;
  }
  .legend-item:hover { border-color: var(--muted); }
  .legend-item.active { border-color: var(--gold); }
  .legend-item .num { display: inline-block; min-width: 3ch; text-align: right; }
  .legend-item .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #wasmbar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 26px; z-index: 20;
    background: var(--panel); border-top: 1px solid var(--border);
    display: flex; align-items: center;
  }
  #wasmbar[hidden] { display: none; }
  #wasmbar-fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: rgba(240, 180, 41, 0.3); transition: width 0.12s linear;
  }
  #wasmbar-label {
    position: relative; margin-left: 12px; font-size: 12px;
    font-family: Consolas, "Courier New", monospace; color: var(--gold);
  }
</style>
</head>
<body>
<main>
  <h1>网格路径覆盖</h1>
  <section class="card controls">
    <div class="ctl-row">
      <label>行 <input id="rows" type="number" min="1" max="20" value="9"></label>
      <label>列 <input id="cols" type="number" min="1" max="20" value="11"></label>
      <span class="sep"></span>
      <label><input id="boundary" type="checkbox" checked> 端点限边界</label>
    </div>
    <div class="ctl-row">
      <button id="rebuild">重建</button>
      <button id="example">示例</button>
      <button id="clear">清空</button>
      <button id="solve" class="primary" title="求一个任意解">求解</button>
      <button id="cancel" disabled>取消</button>
      <button id="copy" disabled title="复制当前方案的路径序列">复制</button>
    </div>
  </section>
  <section class="card board-wrap">
    <canvas id="board"></canvas>
    <div id="legend" class="legend"></div>
  </section>
  <div id="status" class="status card">就绪</div>
  <div id="prog" class="prog card" hidden><span id="progMsg"></span><span class="timer" id="timer"></span></div>
  <section class="card hist-panel">
    <div class="hist-head">
      <span>方案历史</span>
      <span class="actions">
        <button id="optPaths" disabled title="最小化路径数，证明最优">优化路径数</button>
        <button id="optTurns" disabled title="锁定当前路径数，最小化转弯数，证明最优">优化转弯数</button>
        <button id="optAll" disabled title="先优化路径数，再优化转弯数">一键优化</button>
      </span>
    </div>
    <div class="hist-head">
      <span>会话</span>
      <span class="actions">
        <button id="exportBtn" class="sm" title="导出会话 JSON 文件">导出</button>
        <button id="importBtn" class="sm" title="导入会话 JSON 文件">导入</button>
        <button id="clearSess" class="sm danger" title="清除已保存的会话历史">清除</button>
        <input id="importFile" type="file" accept=".json,application/json" hidden>
      </span>
    </div>
    <div id="hist" class="clist"></div>
  </section>
</main>
<div id="wasmbar" hidden>
  <div id="wasmbar-fill"></div>
  <span id="wasmbar-label"></span>
</div>
<script src="app.js" defer></script>
</body>
</html>
